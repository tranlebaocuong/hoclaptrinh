<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎶 Phân Biệt Tiếng Hót Các Loài Chim - Bài Tập Thầy Dũng</title>

  <!-- Google Fonts: Plus Jakarta Sans & Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Thư viện p5.js và ml5.js cho Teachable Machine Sound -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.dom.min.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js" type="text/javascript"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 15% 15%, #133b43 0%, #081c24 50%, #030f14 100%);
      --card-bg: rgba(14, 38, 48, 0.88);
      --card-border: rgba(72, 202, 228, 0.35);
      --bird-cyan: #48cae4;
      --bird-yellow: #ffd166;
      --text-main: #f0fdf4;
      --shadow-glow: 0 0 35px rgba(72, 202, 228, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', 'Be Vietnam Pro', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 32px 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), var(--shadow-glow);
      backdrop-filter: blur(20px);
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .badge-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(72, 202, 228, 0.15);
      border: 1px solid rgba(72, 202, 228, 0.4);
      color: var(--bird-cyan);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #ffffff 30%, #caf0f8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .project-info {
      background: rgba(8, 28, 36, 0.65);
      border: 1px dashed rgba(72, 202, 228, 0.35);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 20px;
      text-align: left;
    }

    .project-info p.lead-text {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--bird-yellow);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bird-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .bird-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .tag-khuyen    { background: rgba(255, 209, 102, 0.18); border: 1px solid rgba(255, 209, 102, 0.45); color: #ffd166; }
    .tag-chaomao   { background: rgba(247, 127, 0, 0.18);   border: 1px solid rgba(247, 127, 0, 0.45);   color: #f77f00; }
    .tag-chichchoe { background: rgba(240, 243, 246, 0.15); border: 1px solid rgba(240, 243, 246, 0.35); color: #e2e8f0; }
    .tag-hoami     { background: rgba(196, 154, 108, 0.2);  border: 1px solid rgba(196, 154, 108, 0.45); color: #e9c46a; }
    .tag-thanhtuoc { background: rgba(82, 183, 136, 0.2);  border: 1px solid rgba(82, 183, 136, 0.45);  color: #74c69d; }
    .tag-sese      { background: rgba(166, 124, 82, 0.2);   border: 1px solid rgba(166, 124, 82, 0.45);   color: #ddb892; }

    #canvas-holder {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 18px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.55), 0 0 25px rgba(42, 157, 143, 0.25);
      border: 2px solid rgba(72, 202, 228, 0.4);
      width: fit-content;
      background: #041017;
      line-height: 0;
    }

    #canvas-holder canvas {
      display: block;
      border-radius: 16px;
    }

    .controls-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-mic {
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(0, 180, 216, 0.35);
    }
    .btn-mic:hover { transform: translateY(-2px); }

    .btn-mic.listening {
      background: linear-gradient(135deg, #52b788, #2d6a4f);
      box-shadow: 0 0 25px rgba(82, 183, 136, 0.6);
    }

    .btn-test {
      background: rgba(255, 209, 102, 0.18);
      border: 1px solid rgba(255, 209, 102, 0.45);
      color: var(--bird-yellow);
    }
    .btn-test:hover { transform: translateY(-2px); background: rgba(255, 209, 102, 0.28); }

    .tip-box {
      font-size: 0.8rem;
      color: rgba(202, 240, 248, 0.8);
      line-height: 1.5;
    }
    .tip-box i { color: var(--bird-yellow); margin-right: 4px; }
  </style>
</head>

<body>

  <div class="app-card">
    <div class="badge-header">
      <i class="fa-solid fa-microphone-lines"></i> Nhận Diện Âm Thanh AI
    </div>

    <h1>PHÂN BIỆT TIẾNG HÓT CÁC LOÀI CHIM 🦜</h1>

    <div class="project-info">
      <p class="lead-text">
        <i class="fa-solid fa-tree"></i> Bài tập của âm thanh của thầy Dũng:
      </p>
      <div class="bird-tags">
        <span class="bird-tag tag-khuyen"><i class="fa-solid fa-dove"></i> Chim Vành Khuyên</span>
        <span class="bird-tag tag-chaomao"><i class="fa-solid fa-feather"></i> Chim Chào Mào</span>
        <span class="bird-tag tag-chichchoe"><i class="fa-solid fa-music"></i> Chim Chích Chòe</span>
        <span class="bird-tag tag-hoami"><i class="fa-solid fa-crow"></i> Chim Họa Mi</span>
        <span class="bird-tag tag-thanhtuoc"><i class="fa-solid fa-kiwi-bird"></i> Chim Thanh Tước</span>
        <span class="bird-tag tag-sese"><i class="fa-solid fa-feather-pointed"></i> Chim Se Sẻ</span>
      </div>
    </div>

    <!-- Khung Canvas p5.js -->
    <div id="canvas-holder"></div>

    <!-- Nút điều khiển sạch sẽ (Không bị xuống dòng trong thuộc tính) -->
    <div class="controls-row">
      <button class="btn-action btn-mic listening" id="micBtn" onclick="toggleListening()">
        <i class="fa-solid fa-microphone"></i> <span id="micBtnText">Micro: Đang Lắng Nghe...</span>
      </button>
      <button class="btn-action btn-test" id="testBtn" onclick="simulateBirdSound()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Thử Giả Lập Tiếng Chim
      </button>
    </div>

    <p class="tip-box">
      <i class="fa-solid fa-circle-info"></i> <em>Mẹo: Hãy phát tiếng chim hót gần micro hoặc bấm Thử Giả Lập Tiếng Chim để kiểm tra phản hồi!</em>
    </p>
  </div>

  <!-- Nạp file script sketch.js (chuẩn p5.js Web Editor) -->
  <script src="sketch.js"></script>

  <!-- Khai báo hàm dự phòng an toàn để không bao giờ bị báo lỗi đỏ -->
  <script>
    if (typeof window.toggleListening === 'undefined') {
      window.toggleListening = function() {
        if (typeof toggleListening === 'function') toggleListening();
      };
    }
    if (typeof window.simulateBirdSound === 'undefined') {
      window.simulateBirdSound = function() {
        if (typeof simulateBirdSound === 'function') simulateBirdSound();
      };
    }
  </script>
</body>

</html>
